[package]
name = "emr-management-tool"
version = "0.1.0"
description = "Desktop GUI for EMR on EKS job management"
authors = ["EMR Management Tool"]
edition = "2021"

[lib]
name = "emr_management_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
aws-config = { version = "1.8.18", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client", "sso"] }
aws-smithy-types = "1.4.9"
aws-credential-types = "1.2.14"
aws-sdk-cloudwatchlogs = { version = "1.135.0", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
aws-sdk-athena = { version = "1.110.0", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
aws-sdk-emrcontainers = { version = "1.107.0", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
aws-sdk-glue = { version = "1.110.0", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
aws-sdk-s3 = { version = "1.135.0", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client", "sigv4a"] }
aws-sdk-sts = { version = "1.106.0", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
aws-types = "1.3.16"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "6.0.0"
flate2 = "1.1.9"
keyring-core = "1.0.0"
rfd = "0.16.0"
serde = { version = "1.0.228", features = ["derive"] }
urlencoding = "2.1.3"
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "chrono"] }
tauri = { version = "2.11.3", features = ["test"] }
tauri-plugin-store = "2.4.3"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "fs", "io-util", "parking_lot", "process"] }
axum = "0.8"
nanoid = "0.4"
uuid = { version = "1.23.3", features = ["v4", "serde"] }
tauri-plugin-updater = "2.10.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
minisign-verify = "0.2"
semver = "1.0"
rmcp = { version = "3.1.4", features = ["server", "client", "transport-streamable-http-server", "transport-worker"] }
schemars = "1.2"
regex = "1.13.1"
tokio-util = "0.7.19"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.0", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.0.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
